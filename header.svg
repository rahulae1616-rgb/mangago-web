<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0d0e17"/>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00">
        <animate attributeName="stop-color" values="#ff7b00;#ff0055;#9d00ff;#00f2fe;#ff7b00" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff0055">
        <animate attributeName="stop-color" values="#ff0055;#9d00ff;#00f2fe;#ff7b00;#ff0055" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffb700">
        <animate attributeName="stop-color" values="#ffb700;#00f2fe;#ff7b00;#ff0055;#ffb700" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Fire/Gold Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="35%" stop-color="#ff5500"/>
      <stop offset="70%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComponentTransfer result="brightBlur">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@600;800&amp;display=swap');

    .bg {
      fill: url(#bgGrad);
      rx: 18px;
    }

    .border-line {
      fill: none;
      stroke: url(#borderGrad);
      stroke-width: 3;
      rx: 18px;
    }

    .title {
      font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 72px;
      letter-spacing: 6px;
      fill: url(#titleGrad);
      text-anchor: middle;
      transform-box: fill-box;
      transform-origin: center;
      filter: drop-shadow(0px 4px 18px rgba(255, 123, 0, 0.45));
      animation: pulseTitle 3s ease-in-out infinite alternate;
    }

    .subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 4px;
      fill: #e2e8f0;
      text-anchor: middle;
      text-transform: uppercase;
      opacity: 0.95;
    }

    .subtitle-accent {
      fill: #ffb700;
    }

    .pill {
      rx: 17px;
      fill: rgba(255, 255, 255, 0.06);
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 1.5;
    }

    .pill-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #cbd5e1;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }

    .star {
      fill: #ffb700;
      transform-box: fill-box;
      transform-origin: center;
      animation: floatStar 4s ease-in-out infinite alternate;
    }

    .star-delay-1 { animation-delay: 1s; fill: #ff007f; }
    .star-delay-2 { animation-delay: 2s; fill: #00f2fe; }

    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }

    .speed-line {
      stroke: rgba(255, 123, 0, 0.18);
      stroke-width: 2;
      stroke-dasharray: 10, 20;
      animation: speedMove 2s linear infinite;
    }

    @keyframes pulseTitle {
      0% {
        transform: scale(1);
        filter: drop-shadow(0px 4px 18px rgba(255, 123, 0, 0.45));
      }
      100% {
        transform: scale(1.02);
        filter: drop-shadow(0px 6px 28px rgba(255, 0, 127, 0.75));
      }
    }

    @keyframes floatStar {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-10px) rotate(15deg); opacity: 1; }
    }

    @keyframes speedMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -60; }
    }
  </style>

  <!-- Background Rect -->
  <rect class="bg" width="994" height="274" x="3" y="3"/>

  <!-- Manga Speed / Accent Grid Lines -->
  <g opacity="0.7">
    <line class="grid-line" x1="0" y1="65" x2="1000" y2="65"/>
    <line class="grid-line" x1="0" y1="215" x2="1000" y2="215"/>
    <line class="speed-line" x1="40" y1="38" x2="960" y2="38"/>
    <line class="speed-line" x1="70" y1="242" x2="930" y2="242"/>
  </g>

  <!-- Decorative Anime Stars & Particles -->
  <g>
    <!-- Left Star -->
    <path class="star" d="M120 70 L123 79 L132 82 L123 85 L120 94 L117 85 L108 82 L117 79 Z" />
    <!-- Right Star -->
    <path class="star star-delay-1" d="M870 65 L873 74 L882 77 L873 80 L870 89 L867 80 L858 77 L867 74 Z" />
    <!-- Small Top Star -->
    <path class="star star-delay-2" d="M490 24 L492 30 L498 32 L492 34 L490 40 L488 34 L482 32 L488 30 Z" />
  </g>

  <!-- Title & Subtitle Content -->
  <g transform="translate(0, 12)">
    <!-- Main Title -->
    <text class="title" x="500" y="102">MANGA GO</text>
    
    <!-- Subtitle -->
    <text class="subtitle" x="500" y="146">
      <tspan class="subtitle-accent">★</tspan> Free Unlimited Manga &amp; Webtoon Reader <tspan class="subtitle-accent">★</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <g transform="translate(130, 0)">
        <rect class="pill" width="160" height="34" x="0" y="0"/>
        <text class="pill-text" x="80" y="22">📚 1,000+ Sources</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(310, 0)">
        <rect class="pill" width="170" height="34" x="0" y="0"/>
        <text class="pill-text" x="85" y="22">⚡ Zero Downloads</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(500, 0)">
        <rect class="pill" width="170" height="34" x="0" y="0"/>
        <text class="pill-text" x="85" y="22">🔄 Auto-Synced</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(690, 0)">
        <rect class="pill" width="150" height="34" x="0" y="0"/>
        <text class="pill-text" x="75" y="22">🔥 100% Free</text>
      </g>
    </g>
  </g>

  <!-- Glowing Border Rect -->
  <rect class="border-line" width="994" height="274" x="3" y="3"/>
</svg>
